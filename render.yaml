# Render Blueprint: https://render.com/docs/blueprint-spec
# The database is a free Neon PostgreSQL (no card needed): paste its connection
# string into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: kbank
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn bank_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DEMO_MODE
        value: "True"
      - key: DATABASE_URL
        sync: false
